[package]
name = "cadview-core"
version = "0.1.0"
edition = "2021"
description = "Core CAD document model, DWG parsing, cad_call dispatcher, and Yrs CRDT sync"
license.workspace = true
repository.workspace = true

[dependencies]
acadrust = "0.3"
bincode = "1"
kurbo = { version = "0.13", features = ["serde"] }
skrifa = "0.26"
yrs = "0.26"
earcutr = "0.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.40", features = ["serialize"] }
printpdf = "0.9"
mtext = { path = "../mtext" }
