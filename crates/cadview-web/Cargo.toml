[package]
name = "cadview-web"
version = "0.1.0"
edition = "2021"
description = "WASM browser target: session registry, dual renderer (Vello + egui), wasm-bindgen exports"
license.workspace = true
repository.workspace = true

[features]
default = ["vello-renderer"]
embed-dwg = []
vello-renderer = ["dep:vello", "dep:wgpu"]

[dependencies]
cadview-core = { path = "../cadview-core" }
eframe = "0.34"
egui = "0.34"
kurbo = "0.13"
serde_json = "1"
vello = { version = "0.9", optional = true, default-features = false, features = ["wgpu"] }
wgpu = { version = "29", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "Document", "Window", "Element",
    "PointerEvent", "WheelEvent",
    "AddEventListenerOptions",
    "ResizeObserver", "ResizeObserverEntry",
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
