<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@500&amp;display=swap');
    </style>
  </defs>

  <rect width="480" height="160" fill="#0A0E14"/>

  <!-- Crosshair: vertical line -->
  <line x1="64" y1="0" x2="64" y2="160" stroke="#FFB000" stroke-width="1.5"/>
  <!-- Crosshair: horizontal line -->
  <line x1="0" y1="80" x2="480" y2="80" stroke="#FFB000" stroke-width="1.5"/>
  <!-- Crosshair: center circle -->
  <circle cx="64" cy="80" r="12" fill="none" stroke="#FFB000" stroke-width="1.5"/>

  <!-- Wordmark -->
  <text x="108" y="92" font-family="'Jost', sans-serif" font-weight="500"
        font-size="48" fill="#E8E8E8" letter-spacing="1">CodeCAD</text>
</svg>
