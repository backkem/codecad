[package]
name = "solid-harness"
version = "0.1.0"
edition = "2021"
description = "Kernel-independent test harness for CodeCAD's solid kernels: certified reference semantics, evidence layers, broken adapters and scoreboards"
license.workspace = true
repository.workspace = true
# A test tool. No shipped crate (cadview-core, cadview-render, cadview-web,
# cadview-server) may depend on it.
publish = false

[dependencies]
cadview-core = { path = "../cadview-core" }
kurbo = "0.13"
# The candidate kernels under test, pinned exactly. Only src/kernels/arris.rs
# names arris and only src/kernels/cad_kernel.rs names cad-kernel.
# `paranoid`: a release build runs the kernel's checker on every operation's
# output and returns an error for a result it rejects (a debug build does
# that anyway, as a panic the adapter turns into the same error).
arris = { version = "=0.11.1", default-features = false, features = ["paranoid"] }
cad-kernel = "=0.15.0"
