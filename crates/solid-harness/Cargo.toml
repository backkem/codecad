[package]
name = "solid-harness"
version = "0.1.0"
edition = "2021"
description = "Kernel-independent test harness for CodeCAD's solid kernels: certified reference semantics, evidence layers, broken adapters and scoreboards"
license.workspace = true
repository.workspace = true
# A test tool. No shipped crate (cadview-core, cadview-render, cadview-web,
# cadview-server) may depend on it.
publish = false

[dependencies]
cadview-core = { path = "../cadview-core" }
# The shipped kernel adapter (arris, pinned there), under test here.
cadview-solid = { path = "../cadview-solid" }
kurbo = "0.13"
# The second kernel, a test-only second opinion, pinned exactly. Only
# src/kernels/cad_kernel.rs names it.
cad-kernel = "=0.15.0"
# Only for the development-time wasm timing runner (examples/wasm_timings.rs):
# the version the workspace already locks through the script sandbox.
wasmtime = { version = "=50.0.1", optional = true }

[features]
# The native host that runs the corpus as a wasm module.
wasm-runner = ["dep:wasmtime"]

# The corpus as wasm modules, built for wasm32-unknown-unknown: with arris
# (timed by wasm_timings) and without a kernel (the size baseline).
[[example]]
name = "wasm_corpus"
crate-type = ["cdylib"]

[[example]]
name = "wasm_corpus_base"
crate-type = ["cdylib"]

[[example]]
name = "wasm_timings"
required-features = ["wasm-runner"]

[dev-dependencies]
cadview-render3d = { path = "../cadview-render3d" }
