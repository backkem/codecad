[package]
name = "cadview-web"
version = "0.1.0"
edition = "2021"
description = "WASM browser target: session registry, dual renderer (Vello + egui), wasm-bindgen exports"
license.workspace = true
repository.workspace = true

[features]
default = ["vello-renderer"]
embed-dwg = []
vello-renderer = ["dep:wgpu", "dep:cadview-render", "dep:cadview-render3d"]

[dependencies]
cadview-core = { path = "../cadview-core" }
eframe = "0.37.0"
egui = "0.37.0"
kurbo = "0.13"
serde_json = "1"
wgpu = { version = "30.0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cadview-render = { path = "../cadview-render", optional = true, default-features = false, features = ["gpu"] }
# The 3D viewport: raster (working) and path-traced (presentation) backends
# on the same device.
cadview-render3d = { path = "../cadview-render3d", optional = true }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement", "Document", "Window", "Element",
    "PointerEvent", "WheelEvent", "MouseEvent", "Performance",
    "AddEventListenerOptions",
    "ResizeObserver", "ResizeObserverEntry",
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
