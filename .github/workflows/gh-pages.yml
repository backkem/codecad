name: Deploy to GitHub Pages

# Runs only when something the site is built from changes. Docs, the
# server, the test harness and other crates do not rebuild it.
on:
  push:
    branches: [main]
    paths:
      - "crates/cadview-core/**"
      - "crates/cadview-render/**"
      - "crates/cadview-render3d/**"
      - "crates/cadview-solid/**"
      - "crates/cadview-kernel-wasm/**"
      - "crates/cadview-web/**"
      - "crates/mtext/**"
      - "web/**"
      - "site/**"
      - "examples/**"
      - "docs/brand/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust lints
        run: cargo clippy -p cadview-core -p cadview-web -- -D warnings

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: cd web && pnpm install --frozen-lockfile

      - name: TypeScript lint
        run: cd web && pnpm exec biome check src/

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: cd web && pnpm install --frozen-lockfile

      - uses: extractions/setup-just@v2

      - name: Build site
        run: just build-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
