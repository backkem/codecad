[workspace]
resolver = "2"
members = [
    "crates/cadview-core",
    "crates/cadview-render",
    "crates/cadview-render3d",
    "crates/cadview-web",
    "crates/cadview-server",
    "crates/cadview-solid",
    "crates/cadview-kernel-wasm",
    "crates/mtext",
    "crates/solid-harness",
]

[workspace.package]
license = "MIT"
repository = "https://github.com/backkem/codecad"

# The kernel (arris) runs its own checker on every operation in debug
# builds (kept: debug assertions stay on) and is very slow unoptimised.
# Optimise it in dev builds so the solid-harness tests run in reasonable
# time; cadview-solid links it (and through it the harness).
[profile.dev.package.arris]
opt-level = 3
[profile.dev.package.arris-check]
opt-level = 3
[profile.dev.package.arris-geom]
opt-level = 3
[profile.dev.package.arris-math]
opt-level = 3
[profile.dev.package.arris-mesh]
opt-level = 3
[profile.dev.package.arris-ops]
opt-level = 3
[profile.dev.package.arris-topo]
opt-level = 3
[profile.dev.package."nalgebra@0.35.0"]
opt-level = 3
# The harness's own sampling and certified enclosures are numeric loops
# that run ten times slower unoptimised; it is a test tool, so optimise it
# in dev builds too (debug assertions stay on).
[profile.dev.package.solid-harness]
opt-level = 3
