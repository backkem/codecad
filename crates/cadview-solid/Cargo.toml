[package]
name = "cadview-solid"
version = "0.1.0"
edition = "2021"
description = "The solid kernel behind cadview-core's SolidKernel trait: the arris adapter"
license.workspace = true
repository.workspace = true

[dependencies]
cadview-core = { path = "../cadview-core" }
kurbo = "0.13"
# The kernel, pinned exactly. This is the only crate that names arris, and
# src/arris.rs the only file. Default features off: no serde and no rayon,
# so it starts no threads. `paranoid`: a release build runs the kernel's
# checker on every operation's output and returns an error for a result it
# rejects (a debug build does that anyway, as a panic the adapter turns
# into the same error).
arris = { version = "=0.11.1", default-features = false, features = ["paranoid"] }
