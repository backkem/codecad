[package]
name = "cadview-render"
version = "0.1.0"
edition = "2021"
description = "Backends for cadview-core display lists: Vello scene builder, headless GPU and CPU render, PNG"
license.workspace = true
repository.workspace = true

[features]
default = ["gpu", "cpu", "cpu-multithreading"]
# Vello scene builder (wasm32 + native) and, on native, the headless wgpu renderer.
gpu = ["dep:vello", "dep:wgpu", "dep:pollster"]
# CPU rasterizer (native, vello_cpu).
cpu = ["dep:vello_cpu"]
# Let vello_cpu use all cores.
cpu-multithreading = ["cpu", "vello_cpu?/multithreading"]

[dependencies]
cadview-core = { path = "../cadview-core" }
kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
vello = { version = "0.9", optional = true, default-features = false, features = ["wgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "29", optional = true }
pollster = { version = "1", optional = true }
png = "0.18.1"
vello_cpu = { version = "0.4.0", optional = true, default-features = false, features = ["std", "u8_pipeline"] }
